<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComicCraft - AI Comic Story Creator</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="hero">
    <div class="card">
      <h1>ComicCraft</h1>
      <p class="tagline">Turn a story idea into a fully illustrated comic, powered by Gemini.</p>

      <form action="/generate" method="post" class="comic-form">
        <label for="story_prompt">Story Prompt</label>
        <textarea id="story_prompt" name="story_prompt" rows="3" placeholder="A brave fox exploring an enchanted forest..." required></textarea>

        <div class="form-row">
          <div class="form-field">
            <label for="character_name">Main Character Name</label>
            <input type="text" id="character_name" name="character_name" placeholder="Finn" required>
          </div>
          <div class="form-field">
            <label for="setting">Setting</label>
            <select id="setting" name="setting" required>
              <option value="forest">Forest</option>
              <option value="school">School</option>
              <option value="space">Space</option>
              <option value="city">City</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="tone">Story Tone</label>
            <select id="tone" name="tone" required>
              <option value="light-hearted">Light-hearted</option>
              <option value="dramatic">Dramatic</option>
              <option value="poetic">Poetic</option>
              <option value="funny">Funny</option>
            </select>
          </div>
          <div class="form-field">
            <label for="art_style">Art Style</label>
            <select id="art_style" name="art_style" required>
              <option value="anime">Anime</option>
              <option value="pixel art">Pixel Art</option>
              <option value="comic book">Comic Book</option>
              <option value="realistic">Realistic</option>
            </select>
          </div>
        </div>

        <div class="form-field">
          <label for="num_panels">Number of Panels</label>
          <input type="number" id="num_panels" name="num_panels" value="5" min="1" max="10" required>
        </div>

        <button type="submit" class="btn-primary">Generate My Comic</button>
        <p class="hint">Generation calls Gemini for text and images, so this can take a little while.</p>
      </form>
    </div>
  </div>
</body>
</html>
